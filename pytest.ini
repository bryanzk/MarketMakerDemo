[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -m "not integration and not e2e" --durations=20
pythonpath = .
markers =
    unit: Unit tests for business logic
    integration: Integration tests
    e2e: End-to-end/UI/browser tests
